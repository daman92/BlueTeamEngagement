# driftwatch — pinned Ansible configuration for the kit control node.
#
# bin/driftwatch always exports DRIFTWATCH_ENGAGEMENT_DIR and passes `-i` explicitly,
# so the active engagement is unambiguous at runtime. Path-type settings below expand
# ${DRIFTWATCH_ENGAGEMENT_DIR} (Ansible runs os.path.expandvars on path values), which
# keeps the inventory, logs and caches inside the active engagement volume — so they
# shred cleanly with it at teardown (design §15.4) and never leak between clients.
#
# This file is the "pinned ansible.cfg" the §9 control described: commit it, ship it in
# the kit image, and never let a per-engagement edit drift it.

[defaults]
# Active engagement's inventory. bin/driftwatch also passes -i, which wins; this makes
# ad-hoc `ansible` commands inside an engagement Just Work too.
inventory                 = ${DRIFTWATCH_ENGAGEMENT_DIR}/inventory/hosts.yml
roles_path                = ./roles
collections_path          = ./collections:~/.ansible/collections:/usr/share/ansible/collections

# Strict host-key checking is a security control, not a convenience toggle: it is the
# transport-downgrade defense from §9. Never set this to False on the kit.
host_key_checking         = True

# Fleet-wide parallelism. 25 is the design §8 default; deep hashing runs async inside the
# roles so a slow host cannot stall the batch.
forks                     = 25
timeout                   = 30
gathering                 = smart
fact_caching              = jsonfile
fact_caching_connection   = ${DRIFTWATCH_ENGAGEMENT_DIR}/.factcache
fact_caching_timeout      = 7200

# Retry files for failed hosts, kept inside the engagement volume (so they are shredded
# at teardown rather than left in the repo).
retry_files_enabled       = True
retry_files_save_path     = ${DRIFTWATCH_ENGAGEMENT_DIR}/.retry

interpreter_python        = auto_silent
deprecation_warnings      = True

# Read-only posture: never write Ansible's own breadcrumbs into target syslog. Collection
# must minimize its forensic footprint on the target (§1 principle 1).
no_target_syslog          = True

# Run logging. The engagement-scoped run log is the audit trail for what the collector did
# on every host — shipped to Splunk as run history (Appendix C.1) and shredded at teardown.
log_path                  = ${DRIFTWATCH_ENGAGEMENT_DIR}/audit/ansible-run.log
stdout_callback           = yaml
callbacks_enabled         = ansible.posix.profile_tasks, community.general.log_plays

[callback_log_plays]
# Per-host command logs — the "every command the collector issues is logged locally"
# control from §15.3. Kept inside the engagement volume.
log_folder                = ${DRIFTWATCH_ENGAGEMENT_DIR}/audit/hostlogs

[inventory]
enable_plugins            = auto, yaml, ini, host_list
# Fail closed: a malformed inventory must abort, never fall back to an empty/implicit one
# that could quietly widen or narrow scope (design §15.2).
unparsed_is_failed        = True

[privilege_escalation]
# Off by default; the linux play/inventory opts into scoped `become` (sudo command
# allowlist per §3). Windows and network never escalate this way.
become                    = False

[ssh_connection]
# Pipelining "where safe": it removes a round-trip per task, but requires the sudoers
# entries the client grants NOT to set `requiretty`. The §3 sudoers command-allowlist
# is written without requiretty, so this is safe here. Disable it if a target still sets
# requiretty for the collector account.
pipelining                = True
ssh_args                  = -o ControlMaster=auto -o ControlPersist=90s -o StrictHostKeyChecking=yes -o PreferredAuthentications=publickey,gssapi-with-mic,password
retries                   = 2

[persistent_connection]
# network_cli / httpapi (network devices). Give slow config pulls room without hanging
# the fleet.
command_timeout           = 60
connect_timeout           = 60

# NOTE: WinRM transport settings (ansible_winrm_transport=kerberos, ansible_port=5986,
# server_cert_validation=validate) are host/group vars, not ansible.cfg keys. They live in
# the engagement's inventory group_vars, seeded from the preflight transport matrix.
