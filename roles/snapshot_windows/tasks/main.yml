- name: "W7  - Autoruns"
  ansible.builtin.include_tasks: autoruns.yml
- name: "W8  - WMI event subscriptions"
  ansible.builtin.include_tasks: wmi_subscriptions.yml
- name: "W9a - Local users"
  ansible.builtin.include_tasks: users.yml
- name: "W9b - Local privileged groups"
  ansible.builtin.include_tasks: local_groups.yml
- name: "W10 - Drivers"
  ansible.builtin.include_tasks: drivers.yml
- name: "W11a- Installed software"
  ansible.builtin.include_tasks: software.yml
- name: "W11b- Hotfixes"
  ansible.builtin.include_tasks: hotfixes.yml
- name: "W12 - Host firewall"
  ansible.builtin.include_tasks: firewall.yml
- name: "W13 - DNS / hosts / proxy / trust store"
