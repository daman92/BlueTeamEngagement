---
# snapshot_windows — read-only Windows collector (design §4.2 W1-W17, CONTRACTS §3.2).
#
# Read-only by construction (enforced by scripts/lint_readonly.py, a security control per
# design §15.3): every collection task is `ansible.windows.win_powershell` carrying the
# `readonly` tag, asserting the PowerShell only reads. The ONLY writes are the snapshot
# assembly at the end, delegated to localhost (control node), never to the target.
#
# A failed category never fails the play (CONTRACTS §1.5): each collection task has
# ignore_errors, and its category name is recorded in dw_failed_categories so the final
# document is marked meta.partial with meta.failed_categories populated.

- name: Initialize snapshot assembly state
  ansible.builtin.set_fact:
    dw_failed_categories: []

- name: Collect host meta (OS, hostname, collection time)
  ansible.windows.win_powershell:
    depth: 3
    script: |
      $Ansible.Changed = $false
      $ErrorActionPreference = 'SilentlyContinue'
      $os = $null
      try {
        $o = Get-CimInstance -ClassName Win32_OperatingSystem -ErrorAction Stop
        $os = ("$($o.Caption) $($o.Version)").Trim()
      } catch { $os = 'Windows' }
      [ordered]@{
        os           = $os
        hostname     = $env:COMPUTERNAME
        collected_at = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
      }
  register: reg_hostmeta
  ignore_errors: true
  tags: [readonly]

# --- Category fragments (one registered win_powershell read per category) --------------
- name: "W1  - Running processes"
  ansible.builtin.include_tasks: processes.yml
- name: "W2  - Fileless indicators"
