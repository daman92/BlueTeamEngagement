---
# roles/snapshot_network/meta/main.yml
galaxy_info:
  role_name: snapshot_network
  namespace: driftwatch
  author: driftwatch
  description: >-
    Read-only, three-tier (T1/T2/T3) network-device snapshot collector for the
    driftwatch blue-team drift-detection framework. Emits one canonical JSON
    snapshot document per device per run (CONTRACTS.md §2 + §3.4). Assembles and
    writes the snapshot on the control node only — it never writes to a target
    and uses no *_config modules.
  company: ""
  license: "MIT"
  min_ansible_version: "2.14"
  platforms:
    - name: EL
      versions:
        - "9"
    - name: Debian
      versions:
        - all
    - name: Ubuntu
      versions:
        - all
  galaxy_tags:
    - networking
    - security
    - drift
    - baseline
    - readonly

# This is a leaf collector role; it pulls in nothing else.
dependencies: []
